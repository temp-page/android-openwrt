name: Build Droidspaces OpenWrt IPSet rootfs

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the rootfs as a GitHub release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      OPENWRT_REF: openwrt-24.10
    steps:
      - uses: actions/checkout@v4

      - name: Start persistent progress timeline
        run: |
          printf '%s | checkout complete\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > build-progress.log
          printf '## Build progress\n\n- Checkout complete\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Install build prerequisites
        run: |
          printf '%s | installing build prerequisites\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a build-progress.log
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget jq xz-utils
          printf '%s | prerequisites installed\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a build-progress.log

      - name: Fetch and configure OpenWrt
        run: |
          printf '%s | cloning OpenWrt source\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a build-progress.log
          git clone --depth 1 --branch "$OPENWRT_REF" https://github.com/openwrt/openwrt.git openwrt
          ./openwrt/scripts/feeds update -a
          ./openwrt/scripts/feeds install -a
          cp openwrt-ipset.config openwrt/.config
          # IPSet support in dnsmasq uses kernel UAPI headers only.  Do not
          # make its IPK depend on an OpenWrt 6.6 kmod: Droidspaces uses the
          # Android host kernel, and building the kmod also drags in a full
          # (unneeded) OpenWrt kernel build.
          sed -i 's/+PACKAGE_dnsmasq_full_ipset:kmod-ipt-ipset//' \
            openwrt/package/network/services/dnsmasq/Makefile
          make -C openwrt defconfig
          printf '%s | OpenWrt configured\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a build-progress.log

      - name: Build IPSet-only dnsmasq-full
        run: |
          set -o pipefail
          {
            printf '%s | downloading source archives\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a build-progress.log
            make -C openwrt download -j"$(nproc)"
            printf '%s | building host tools\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a build-progress.log
            make -C openwrt tools/install -j"$(nproc)" V=s
            printf '%s | building cross toolchain\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a build-progress.log
            make -C openwrt toolchain/install -j"$(nproc)" V=s
            printf '%s | building IPSet-only dnsmasq-full\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a build-progress.log
            make -C openwrt package/network/services/dnsmasq/compile -j"$(nproc)" V=s
          } 2>&1 | tee build-dnsmasq.log
          mkdir -p artifacts
          ipk=$(find openwrt/bin/packages/aarch64_generic -name 'dnsmasq-full_*.ipk' -print -quit)
          test -n "$ipk"
          cp "$ipk" artifacts/dnsmasq-full-ipset.ipk
          ar p artifacts/dnsmasq-full-ipset.ipk control.tar.gz | tar -xzOf - ./control > artifacts/dnsmasq-control.txt
          ! grep -q 'kmod-ipt-ipset' artifacts/dnsmasq-control.txt
          ar p artifacts/dnsmasq-full-ipset.ipk data.tar.gz | tar -xzOf - ./usr/sbin/dnsmasq > artifacts/dnsmasq
          chmod +x artifacts/dnsmasq
          artifacts/dnsmasq --version | tee artifacts/dnsmasq-version.txt
          grep -q 'ipset' artifacts/dnsmasq-version.txt
          ! grep -q 'nftset' artifacts/dnsmasq-version.txt
          printf '%s | dnsmasq package verified\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a build-progress.log

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build Droidspaces rootfs archive
        run: |
          printf '%s | building Droidspaces rootfs archive\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a build-progress.log
          mkdir -p out
          docker buildx build --platform linux/arm64 --target export \
            --output type=tar,dest=out/OpenWrt-24.10-IPSet-Droidspaces-rootfs-aarch64.tar \
            --build-arg OPENWRT_VERSION=24.10.7 .
          xz -T0 -9 out/OpenWrt-24.10-IPSet-Droidspaces-rootfs-aarch64.tar
          sha256sum out/*.xz > out/SHA256SUMS
          printf '%s | rootfs archive complete\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a build-progress.log

      - name: Publish final progress summary
        if: always()
        run: |
          printf '\n### Persistent timeline\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat build-progress.log >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: |
            build-dnsmasq.log
            build-progress.log
            openwrt/logs/
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-24.10-IPSet-Droidspaces-rootfs-aarch64
          path: out/
          if-no-files-found: error

      - name: Publish manually requested release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipset-${{ github.run_number }}
          name: Droidspaces OpenWrt IPSet ${{ github.run_number }}
          generate_release_notes: true
          files: out/*
