name: Build Droidspaces OpenWrt IPSet rootfs

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the rootfs as a GitHub release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      OPENWRT_REF: openwrt-24.10
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget jq xz-utils

      - name: Fetch and configure OpenWrt
        run: |
          git clone --depth 1 --branch "$OPENWRT_REF" https://github.com/openwrt/openwrt.git openwrt
          cp openwrt-ipset.config openwrt/.config
          # Android supplies its own IPSet kernel support, so avoid depending on
          # the incompatible OpenWrt 6.6 kmod package.
          sed -i 's/+PACKAGE_dnsmasq_full_ipset:kmod-ipt-ipset/+PACKAGE_dnsmasq_full_ipset:ipset/' \
            openwrt/package/network/services/dnsmasq/Makefile
          make -C openwrt defconfig

      - name: Build IPSet-only dnsmasq-full
        run: |
          make -C openwrt download -j"$(nproc)"
          make -C openwrt package/network/services/dnsmasq/compile -j"$(nproc)" V=s
          mkdir -p artifacts
          ipk=$(find openwrt/bin/packages/aarch64_generic -name 'dnsmasq-full_*.ipk' -print -quit)
          test -n "$ipk"
          cp "$ipk" artifacts/dnsmasq-full-ipset.ipk
          ar p artifacts/dnsmasq-full-ipset.ipk data.tar.gz | tar -xzOf - ./usr/sbin/dnsmasq > artifacts/dnsmasq
          chmod +x artifacts/dnsmasq
          artifacts/dnsmasq --version | tee artifacts/dnsmasq-version.txt
          grep -q 'ipset' artifacts/dnsmasq-version.txt
          ! grep -q 'nftset' artifacts/dnsmasq-version.txt

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build Droidspaces rootfs archive
        run: |
          mkdir -p out
          docker buildx build --platform linux/arm64 --target export \
            --output type=tar,dest=out/OpenWrt-24.10-IPSet-Droidspaces-rootfs-aarch64.tar \
            --build-arg OPENWRT_VERSION=24.10.7 .
          xz -T0 -9 out/OpenWrt-24.10-IPSet-Droidspaces-rootfs-aarch64.tar
          sha256sum out/*.xz > out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-24.10-IPSet-Droidspaces-rootfs-aarch64
          path: out/
          if-no-files-found: error

      - name: Publish manually requested release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipset-${{ github.run_number }}
          name: Droidspaces OpenWrt IPSet ${{ github.run_number }}
          generate_release_notes: true
          files: out/*
